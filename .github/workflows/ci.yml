name: CI

on:
  push:
    branches: ['**']
    tags: ['v[0-9]+.[0-9]+.[0-9]+']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Test / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Install Linux test dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y aria2 fonts-noto-cjk
      - name: Install macOS test engine
        if: runner.os == 'macOS'
        run: brew install aria2
      - name: Install Windows test engine
        if: runner.os == 'Windows'
        run: |
          choco install aria2 --yes --no-progress
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          # The lifecycle tests must own aria2c itself, including its log handles.
          $package = Join-Path $env:ChocolateyInstall 'lib/aria2'
          $engines = @(Get-ChildItem -LiteralPath $package -Filter aria2c.exe -File -Recurse)
          if ($engines.Count -ne 1) { throw "Expected one aria2c executable under $package" }
          $engine = $engines[0].FullName
          & $engine --version
          "SKIFF_ARIA2_BINARY=$engine" >> $env:GITHUB_ENV
      - name: Check formatting
        if: runner.os == 'Linux'
        run: make format-check
      - name: Vet
        run: go vet -tags integration ./...
      - name: Run unit, contract and integration tests
        run: go test -count=1 -timeout=20m -tags integration ./...

  package:
    name: Package / ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-amd64
            os: ubuntu-24.04
            packages: |
              build/linux-amd64/skiff-*-linux-amd64.tar.gz
              build/linux-amd64/skiff_*.deb
              build/linux-amd64/skiff-*.rpm
          - platform: darwin-arm64
            os: macos-15
            packages: build/darwin-arm64/skiff-*.dmg
          - platform: windows-amd64
            os: windows-2025
            packages: build/windows-amd64/skiff-setup-*.exe
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Build native packages
        run: go tool mygo build
      - name: Upload packages
        uses: actions/upload-artifact@v7
        with:
          name: skiff-${{ matrix.platform }}
          path: ${{ matrix.packages }}
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    if: github.event_name == 'push' && github.ref_type == 'tag'
    needs: [test, package]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    concurrency: release-${{ github.ref }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: skiff-*
          path: dist
          merge-multiple: true
      - name: Publish native packages
        working-directory: dist
        shell: bash
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          version=${TAG#v}
          assets=(
            "skiff-${version}-arm64.dmg"
            "skiff-setup-${version}-amd64.exe"
            "skiff-${version}-linux-amd64.tar.gz"
            "skiff_${version}_amd64.deb"
            "skiff-${version}-1.x86_64.rpm"
          )
          for asset in "${assets[@]}"; do
            if [[ ! -s "$asset" ]]; then
              echo "::error::Missing $asset. Check the package version in mygo.json and the tag $TAG."
              exit 1
            fi
          done

          if release=$(gh release view "$TAG" --json isDraft,assets); then
            if [[ $(jq -r '.isDraft' <<< "$release") == false ]]; then
              for asset in "${assets[@]}"; do
                jq -e --arg name "$asset" 'any(.assets[]; .name == $name and .state == "uploaded")' <<< "$release" >/dev/null
              done
              exit 0
            fi
            # Resume a draft left by an interrupted upload.
            gh release upload "$TAG" "${assets[@]}" --clobber
            gh release edit "$TAG" --draft=false
          else
            gh release create "$TAG" "${assets[@]}" --verify-tag --title "Skiff $TAG" --generate-notes
          fi
