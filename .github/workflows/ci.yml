name: CI

on:
  push:
    branches: ['**']
    tags: ['v[0-9]+.[0-9]+.[0-9]+']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  engine-install:
    name: Engine install / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-15, asset: darwin-arm64.tar.gz }
          - { os: ubuntu-24.04, asset: linux-x64.tar.gz }
          - { os: ubuntu-24.04-arm, asset: linux-arm64.tar.gz }
          - { os: windows-2025, asset: win32-x64.zip }
          - { os: windows-11-arm, asset: win32-arm64.zip }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Install the native engine and download a file
        shell: bash
        env:
          ASSET: aria2c-1.37.0-motrix.24-${{ matrix.asset }}
        run: |
          export SKIFF_TEST_ENGINE_ARCHIVE="$RUNNER_TEMP/$ASSET"
          curl --fail --location --retry 3 --output "$SKIFF_TEST_ENGINE_ARCHIVE" \
            "https://github.com/motrixapp/aria2/releases/download/v1.37.0-motrix.24/$ASSET"
          go test -count=1 -tags 'integration,engine_release' ./tests/integration/transfer -run '^TestNativeEngineReleaseDownloadsFile$' -v

  test:
    name: Test / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Install Linux test dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y aria2 fonts-noto-cjk
      - name: Install macOS test engine
        if: runner.os == 'macOS'
        run: brew install aria2
      - name: Install Windows test engine
        if: runner.os == 'Windows'
        run: |
          choco install aria2 --yes --no-progress
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          # The lifecycle tests must own aria2c itself, including its log handles.
          $package = Join-Path $env:ChocolateyInstall 'lib/aria2'
          $engines = @(Get-ChildItem -LiteralPath $package -Filter aria2c.exe -File -Recurse)
          if ($engines.Count -ne 1) { throw "Expected one aria2c executable under $package" }
          $engine = $engines[0].FullName
          & $engine --version
          "SKIFF_ARIA2_BINARY=$engine" >> $env:GITHUB_ENV
      - name: Check formatting
        if: runner.os == 'Linux'
        run: make format-check
      - name: Test release preparation
        if: runner.os == 'Linux'
        run: python3 -B -m unittest discover -s tests/contract -p test_release.py
      - name: Vet
        run: go vet -tags integration ./...
      - name: Run unit, contract and integration tests
        run: go test -count=1 -timeout=20m -tags integration ./...

  package:
    name: Package / ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-amd64
            os: ubuntu-24.04
            packages: |
              build/linux-amd64/skiff-*-linux-amd64.tar.gz
              build/linux-amd64/skiff_*.deb
              build/linux-amd64/skiff-*.rpm
          - platform: darwin-arm64
            os: macos-15
            packages: build/darwin-arm64/skiff-*.dmg
          - platform: windows-amd64
            os: windows-2025
            packages: build/windows-amd64/skiff-setup-*.exe
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Build native packages
        run: go tool mygo build
      - name: Upload packages
        uses: actions/upload-artifact@v7
        with:
          name: skiff-${{ matrix.platform }}
          path: ${{ matrix.packages }}
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    if: github.event_name == 'push' && github.ref_type == 'tag'
    needs: [test, package, engine-install]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    concurrency: release-${{ github.ref }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          pattern: skiff-*
          path: dist
          merge-multiple: true
      - name: Publish native packages
        shell: bash
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          notes="$RUNNER_TEMP/skiff-release-notes.md"
          python3 scripts/prepare-release.py "$TAG" dist release > "$notes"
          cd release
          assets=(skiff-*)

          if release=$(gh release view "$TAG" --json isDraft,assets); then
            if [[ $(jq -r '.isDraft' <<< "$release") == false ]]; then
              for asset in "${assets[@]}"; do
                jq -e --arg name "$asset" 'any(.assets[]; .name == $name and .state == "uploaded")' <<< "$release" >/dev/null
              done
              exit 0
            fi
            # Refresh the notes as well when resuming an interrupted draft.
            printf '\n' >> "$notes"
            gh api -X POST "repos/$GH_REPO/releases/generate-notes" -f tag_name="$TAG" --jq .body >> "$notes"
            gh release upload "$TAG" "${assets[@]}" --clobber
            gh release edit "$TAG" --notes-file "$notes" --draft=false
          else
            gh release create "$TAG" "${assets[@]}" --verify-tag --title "Skiff $TAG" --notes-file "$notes" --generate-notes
          fi
